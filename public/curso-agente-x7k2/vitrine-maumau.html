<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mau-Mau contra os bots</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/brand/observatorio-coruja.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/curso.css">
<style>
  /* Página só da mesa, para entrar na vitrine da aula dentro de um quadro. */
  :root { --u: clamp(8px, 1vw, 13px); } /* letra grande: a mesa aparece pequena dentro da vitrine */
  html, body { height: 100%; }
  body { background: var(--papel); padding: calc(var(--u) * 3); }
  .mm { height: 100%; display: grid; grid-template-rows: auto 1fr; gap: calc(var(--u) * 2); }
  .mm-cabeca h2, .mm-cabeca .lead { display: none; }
  .mm-cabeca { justify-content: flex-start; }
</style>
</head>
<body>
    <div class="mm" data-modo="assistir">
      <div class="mm-cabeca">
        <div>
          <h2>Uma IA que não gera texto, escrita por uma que gera</h2>
          <p class="lead">Os bots seguem regras fixas que uma IA generativa escreveu. Durante a partida, nenhum modelo é chamado.</p>
        </div>
        <div class="mm-controles">
          <div class="chave" role="group" aria-label="Modo">
            <button type="button" data-modo="assistir" aria-pressed="true">Assistir</button>
            <button type="button" data-modo="jogar" aria-pressed="false">Jogar</button>
          </div>
          <div class="chave" role="group" aria-label="Velocidade">
            <button type="button" data-vel="1" aria-pressed="true">1×</button>
            <button type="button" data-vel="2.5" aria-pressed="false">3×</button>
          </div>
          <button type="button" class="botao mm-pausa">Pausar</button>
        </div>
      </div>
      <div class="mm-corpo">
        <div class="mm-mesa">
          <div class="mm-lugar mm-l0"><div class="mm-id"><span class="mm-nome"></span><span class="mm-qtd"></span></div><div class="mm-mao"></div>
            <div class="mm-acoes" hidden>
              <button type="button" class="botao mm-comprar">Comprar</button>
              <button type="button" class="botao cheio mm-gritar">Mau-Mau!</button>
            </div>
          </div>
          <div class="mm-lugar mm-l1"><div class="mm-id"><span class="mm-nome"></span><span class="mm-qtd"></span></div><div class="mm-mao"></div></div>
          <div class="mm-lugar mm-l2"><div class="mm-id"><span class="mm-nome"></span><span class="mm-qtd"></span></div><div class="mm-mao"></div></div>
          <div class="mm-lugar mm-l3"><div class="mm-id"><span class="mm-nome"></span><span class="mm-qtd"></span></div><div class="mm-mao"></div></div>
          <div class="mm-centro">
            <span class="mm-sentido" aria-hidden="true"></span>
            <div class="mm-topo"></div>
            <span class="mm-cor-rotulo">cor da mesa</span>
            <span class="mm-cor"></span>
            <span class="mm-acum"></span>
            <span class="mm-placar" aria-live="polite"></span>
          </div>
          <div class="mm-escolha" hidden>
            <span>Escolha a cor</span>
            <button type="button" data-cor="vermelho" class="mm-carta mm-vermelho" aria-label="vermelho"></button>
            <button type="button" data-cor="azul" class="mm-carta mm-azul" aria-label="azul"></button>
            <button type="button" data-cor="verde" class="mm-carta mm-verde" aria-label="verde"></button>
            <button type="button" data-cor="amarelo" class="mm-carta mm-amarelo" aria-label="amarelo"></button>
          </div>
        </div>
        <aside class="mm-registro" aria-label="Registro das jogadas">
          <h3>Por que cada jogada</h3>
          <ol></ol>
        </aside>
      </div>
    </div>
<script src="js/maumau.js"></script>
<script>
  const mesa = window.criarMesaMauMau(document.querySelector(".mm"));
  mesa.ligar();
  addEventListener("keydown", (e) => { if (mesa.tecla(e.key)) e.preventDefault(); });
  // Fora de vista (aba escondida ou quadro descarregado), a partida para.
  document.addEventListener("visibilitychange", () => document.hidden ? mesa.desligar() : mesa.ligar());
</script>
</body>
</html>
